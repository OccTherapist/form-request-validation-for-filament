name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        filament: ['4.*', '5.*']
        stability: [prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
            pest: '^3.0|^4.0'
            pest-plugin: '^3.0|^4.0'
          - laravel: '13.*'
            testbench: '11.*'
            pest: '^4.0'
            pest-plugin: '^4.0'
        exclude:
          # Laravel 13 requires PHP >= 8.3
          - laravel: '13.*'
            php: '8.2'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "filament/filament:${{ matrix.filament }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}" \
            "pestphp/pest-plugin-laravel:${{ matrix.pest-plugin }}" \
            --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: List installed versions
        run: composer show -D | grep -E 'laravel/framework|filament/filament|orchestra/testbench|pestphp/pest'

      - name: Run tests
        run: vendor/bin/pest --ci
